<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#f3e8ff',
                            card: 'rgba(255, 255, 255, 0.75)',
                            ink: '#374151',
                            inkSoft: '#4b5563',
                            rose: '#f43f5e',
                            roseDeep: '#be123c',
                            blush: '#fbcfe8',
                            lavender: '#c4b5fd'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        display: ['Quicksand', 'sans-serif'],
                        script: ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #f3e8ff;
            background-image: linear-gradient(180deg, #fdf4ff 0%, #f3e8ff 100%);
            background-attachment: fixed; 
            background-repeat: no-repeat;
            min-height: 100vh; 
            margin: 0;
            overflow-x: hidden; 
        }
        
        .section-container {
            display: none; 
            width: 100%;
            max-width: 42rem;
            margin: 0 auto;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            z-index: 10;
        }
        
        .section-container.active {
            display: flex;
            z-index: 20;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .bg-dots {
            background-image: radial-gradient(#d8b4fe 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(167, 139, 250, 0.15);
            border-radius: 2rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            color: white;
            padding: 0.875rem 2rem;
            border-radius: 9999px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.875rem;
            box-shadow: 0 10px 20px rgba(167, 139, 250, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(167, 139, 250, 0.4); }
        .btn-primary:active { transform: translateY(0); }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes float-reverse {
            0%, 100% { transform: translateY(0) rotate(6deg); }
            50% { transform: translateY(-8px) rotate(4deg); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-float-reverse { animation: float-reverse 5s ease-in-out infinite; }

        .petal {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .polaroid {
            background: white; padding: 0.5rem; padding-bottom: 2rem;
            border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 1px solid #f3f4f6;
        }
        
        .flower-sway { animation: sway 4s ease-in-out infinite alternate; }
        @keyframes sway { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }

        @keyframes playProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .playing .progress-fill { animation: playProgress 30s linear infinite; }

        @keyframes slideFadeUp {
            0% { opacity: 0; translate: 0 30px; }
            100% { opacity: 1; translate: 0 0; }
        }
        @keyframes scaleFadeIn {
            0% { opacity: 0; scale: 0.8; }
            100% { opacity: 1; scale: 1; }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(196, 181, 253, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(196, 181, 253, 0); }
            100% { box-shadow: 0 0 0 0 rgba(196, 181, 253, 0); }
        }

        #sec-1.active .glass-card > *,
        #sec-2.active > div.text-center > *,
        #sec-3.active > div.text-center > *,
        #sec-4.active .glass-card > *,
        #sec-4.active > div.text-center > * {
            opacity: 0;
            animation: slideFadeUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .active .glass-card > *:nth-child(1), .active > div.text-center > *:nth-child(1) { animation-delay: 0.1s; }
        .active .glass-card > *:nth-child(2), .active > div.text-center > *:nth-child(2) { animation-delay: 0.2s; }
        .active .glass-card > *:nth-child(3), .active > div.text-center > *:nth-child(3) { animation-delay: 0.3s; }
        .active .glass-card > *:nth-child(4), .active > div.text-center > *:nth-child(4) { animation-delay: 0.4s; }
        .active .glass-card > *:nth-child(5), .active > div.text-center > *:nth-child(5) { animation-delay: 0.5s; }
        .active .glass-card > *:nth-child(6), .active > div.text-center > *:nth-child(6) { animation-delay: 0.6s; }
        .active .glass-card > *:nth-child(7), .active > div.text-center > *:nth-child(7) { animation-delay: 0.7s; }
        .active .glass-card > *:nth-child(8), .active > div.text-center > *:nth-child(8) { animation-delay: 0.8s; }
        .active .glass-card > *:nth-child(9), .active > div.text-center > *:nth-child(9) { animation-delay: 0.9s; }
        .active .glass-card > *:nth-child(10), .active > div.text-center > *:nth-child(10) { animation-delay: 1.0s; }
        .active .glass-card > *:nth-child(11), .active > div.text-center > *:nth-child(11) { animation-delay: 1.1s; }
        .active .glass-card > *:nth-child(12), .active > div.text-center > *:nth-child(12) { animation-delay: 1.2s; }

        #reasons-grid > div {
            opacity: 0;
            animation: scaleFadeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        #sec-3.active #reasons-grid > div:nth-child(1) { animation-delay: 0.3s; }
        #sec-3.active #reasons-grid > div:nth-child(2) { animation-delay: 0.4s; }
        #sec-3.active #reasons-grid > div:nth-child(3) { animation-delay: 0.5s; }
        #sec-3.active #reasons-grid > div:nth-child(4) { animation-delay: 0.6s; }
        #sec-3.active #reasons-grid > div:nth-child(5) { animation-delay: 0.7s; }
        #sec-3.active #reasons-grid > div:nth-child(6) { animation-delay: 0.8s; }

        .envelope-wrapper .envelope-paper {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), translate 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .envelope-wrapper .envelope-flap {
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 10;
        }
        .envelope-wrapper.opened .envelope-flap {
            transform: rotateX(180deg);
            z-index: 5;
        }
        .envelope-wrapper.opened .envelope-paper {
            translate: 0 -80px;
            z-index: 25;
        }
        .envelope-wrapper.opened {
            animation: none;
            scale: 1.05;
            transition: scale 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .playing #play-btn {
            animation: pulseGlow 2s infinite;
        }

        .polaroid {
            transition: scale 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
        }
        .polaroid:hover {
            scale: 1.08;
            box-shadow: 0 15px 30px rgba(0,0,0,0.12);
            z-index: 50;
        }
    </style>
</head>

            letter: {
                tag: "♡ A LETTER, JUST FOR YOU ♡",

                ],
                paragraphsBottom: [

                closing: "yours completely",

                finalNote: "WITH ALL MY LOVE · ME",
                restartBtn: "↻ READ IT AGAIN"
            }
        };

        let currentSection = 0;
        let currentImageIndex = 0;
        let isPlaying = false;
        const audio = document.getElementById('bg-music');

        function populateData() {
            document.getElementById('cfg-intro-hint').innerText = CONFIG.envelope.hint;
            document.getElementById('cfg-intro-tag').innerText = CONFIG.envelope.tag;
            document.getElementById('cfg-intro-seal').innerText = CONFIG.envelope.sealLetter;
            document.getElementById('cfg-intro-title').innerText = CONFIG.envelope.title;
            document.getElementById('cfg-intro-subtitle').innerText = CONFIG.envelope.subtitle;
            document.getElementById('cfg-intro-sign').innerText = CONFIG.envelope.sign;
            document.getElementById('cfg-intro-mascot').src = CONFIG.envelope.mascotUrl;

            document.getElementById('cfg-hero-tag').innerText = CONFIG.hero.tag;
            document.getElementById('cfg-hero-avatar').src = CONFIG.hero.avatarUrl;
            document.getElementById('cfg-hero-title').innerText = CONFIG.hero.title;
            document.getElementById('cfg-hero-subtitle').innerText = CONFIG.hero.subtitle;
            document.getElementById('cfg-hero-body').innerText = CONFIG.hero.body;
            document.getElementById('cfg-song-title').innerText = CONFIG.hero.songTitle;
            document.getElementById('cfg-song-artist').innerText = CONFIG.hero.songArtist;
            document.getElementById('cfg-song-cover').src = CONFIG.hero.songCover;
            document.getElementById('cfg-hero-btn').innerText = CONFIG.hero.buttonText;
            audio.src = CONFIG.musicUrl;

            const minisContainer = document.getElementById('cfg-hero-minis');
            const rotations = ['-rotate-6', 'rotate-2', '-rotate-2'];
            CONFIG.hero.miniPhotos.forEach((src, i) => {
                minisContainer.innerHTML += `<div class="polaroid p-1 pb-3 transform ${rotations[i]}"><img src="${src}" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded"></div>`;
            });

            document.getElementById('cfg-album-tag').innerText = CONFIG.album.tag;
            document.getElementById('cfg-album-title').innerText = CONFIG.album.title;
            document.getElementById('cfg-album-subtitle').innerText = CONFIG.album.subtitle;
            document.getElementById('cfg-album-btn').innerText = CONFIG.album.buttonText;
            updateGallery();

            document.getElementById('cfg-reasons-tag').innerText = CONFIG.reasons.tag;
            document.getElementById('cfg-reasons-title').innerText = CONFIG.reasons.title;
            document.getElementById('cfg-reasons-subtitle').innerText = CONFIG.reasons.subtitle;
            document.getElementById('cfg-reasons-btn').innerText = CONFIG.reasons.buttonText;
            
            const reasonsGrid = document.getElementById('reasons-grid');
            CONFIG.reasons.items.forEach(item => {
                reasonsGrid.innerHTML += `
                    <div class="glass-card flex flex-col items-center justify-center p-3 sm:p-5 text-center h-full">
                        ${item.svg}
                        <p class="mt-3 font-sans text-[13px] sm:text-sm text-brand-ink font-medium leading-snug">${item.text}</p>
                    </div>`;
            });

            document.getElementById('cfg-letter-tag').innerText = CONFIG.letter.tag;
            document.getElementById('cfg-letter-greeting').innerText = CONFIG.letter.greeting;
            
            const cTop = document.getElementById('letter-content');
            CONFIG.letter.paragraphsTop.forEach(p => cTop.innerHTML += `<p>${p}</p>`);
            
            const lImgs = document.getElementById('cfg-letter-images');
            const lRots = ['-rotate-4', 'rotate-2', '-rotate-2'];
            CONFIG.letter.images.forEach((src, i) => {
                lImgs.innerHTML += `<div class="polaroid p-1 pb-4 transform ${lRots[i]} shadow-sm mx-[-5px] sm:mx-2"><img src="${src}" class="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded"></div>`;
            });

            const cBot = document.getElementById('letter-content-2');
            CONFIG.letter.paragraphsBottom.forEach(p => cBot.innerHTML += `<p>${p}</p>`);

            document.getElementById('cfg-letter-closing').innerText = CONFIG.letter.closing;
            document.getElementById('cfg-letter-sign').innerText = CONFIG.letter.signature;
            document.getElementById('cfg-final-note').innerText = CONFIG.letter.finalNote;
            document.getElementById('cfg-final-btn').innerText = CONFIG.letter.restartBtn;
        }

        function createPetals() {
            const container = document.getElementById('petals-container');
            const colors = ['#f7b8c8', '#ffd0c2', '#dcc9ff', '#fff4fb', '#ffe0a8'];
            for(let i=0; i<15; i++) {
                const petal = document.createElement('div');
                const size = Math.random() * 15 + 10;
                const left = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = Math.random() * 10 + 15;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                petal.className = 'petal';
                petal.style.left = `${left}%`;
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.color = color;
                petal.style.animationDelay = `${delay}s`;
                petal.style.animationDuration = `${duration}s`;
                
                petal.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" class="w-full h-full opacity-60"><path d="M12 21 C12 21 3 15.5 3 9.2 C3 5.7 5.4 3.5 8 3.5 C9.8 3.5 11.3 4.6 12 6 C12.7 4.6 14.2 3.5 16 3.5 C18.6 3.5 21 5.7 21 9.2 C21 15.5 12 21 12 21 Z"/></svg>`;
                container.appendChild(petal);
            }
        }

        function nextSection(index) {
            document.querySelectorAll('.section-container').forEach((el, i) => {
                if(i === index) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
            window.scrollTo({top: 0, behavior: 'smooth'});
            
            if(index === 0) {
                const envelopeWrapper = document.querySelector('.envelope-wrapper');
                if (envelopeWrapper) {
                    envelopeWrapper.classList.remove('opened');
                }
            }
        }

        function toggleMusic() {
            const progress = document.getElementById('progress-container');
            if (isPlaying) {
                audio.pause();
                document.getElementById('icon-play').classList.remove('hidden');
                document.getElementById('icon-pause').classList.add('hidden');
                progress.classList.remove('playing');
            } else {
                audio.play().catch(e => console.log("Audio play blocked by browser"));
                document.getElementById('icon-play').classList.add('hidden');
                document.getElementById('icon-pause').classList.remove('hidden');
                progress.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        function updateGallery() {
            const imgEl = document.getElementById('main-gallery-img');
            const capEl = document.getElementById('main-gallery-caption');
            const counterEl = document.getElementById('gallery-counter');
            const thumbsEl = document.getElementById('gallery-thumbs');
            
            const data = CONFIG.album.photos[currentImageIndex];
            
            imgEl.style.opacity = 0;
            imgEl.style.scale = 0.95;
            setTimeout(() => {
                imgEl.src = data.src;
                capEl.innerText = data.caption;
                counterEl.innerText = `0${currentImageIndex + 1} / 0${CONFIG.album.photos.length}`;
                imgEl.style.opacity = 1;
                imgEl.style.scale = 1;
            }, 400);

            thumbsEl.innerHTML = '';
            CONFIG.album.photos.forEach((p, i) => {
                const activeCls = i === currentImageIndex ? 'border-brand-roseDeep opacity-100 scale-110' : 'border-transparent opacity-50 scale-100 hover:opacity-80';
                thumbsEl.innerHTML += `<div onclick="goToImage(${i})" class="w-12 h-12 rounded cursor-pointer transition-all border-2 ${activeCls} overflow-hidden"><img src="${p.src}" class="w-full h-full object-cover"></div>`;
            });
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % CONFIG.album.photos.length;
            updateGallery();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + CONFIG.album.photos.length) % CONFIG.album.photos.length;
            updateGallery();
        }

        function goToImage(idx) {
            currentImageIndex = idx;
            updateGallery();
        }

        window.onload = () => {
            populateData();
            createPetals();
            
            const envelopeWrapper = document.querySelector('.envelope-wrapper');
            if (envelopeWrapper) {
                envelopeWrapper.addEventListener('click', function(e) {
                    if(this.classList.contains('opened')) return; 
                    
                    this.classList.add('opened');
                    
                    if(!isPlaying) toggleMusic();
                    
                    setTimeout(() => {
                        nextSection(1);
                    }, 1400); 
                });
            }
        };
    </script>
</body>
